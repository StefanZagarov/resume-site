<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stefan Zagarov — junior front-end developer building web applications with React and TypeScript. Projects, experience and CV." />
    <title>Stefan Zagarov — Front-End Developer</title>
    <!-- Link previews (LinkedIn, Slack, messengers) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resume-site-29ou.onrender.com/" />
    <meta property="og:title" content="Stefan Zagarov — Front-End Developer" />
    <meta property="og:description" content="Junior front-end developer building web applications with React and TypeScript. Projects, experience and CV." />
    <meta property="og:image" content="https://resume-site-29ou.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are self-hosted (src/fonts.css); preload the Latin files the first screen uses -->
    <link rel="preload" href="/fonts/instrument-sans-400-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-500-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
